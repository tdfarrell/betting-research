<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screener | Ballwatcher</title>
<meta name="description" content="Ballwatcher's slate screener: every DraftKings college football and NFL line graded by our models, with matchup notes and line movement. Updated every 30 minutes.">
<link rel="canonical" href="https://ballwatcher.com/screener/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Ballwatcher">
<meta property="og:title" content="Screener | Ballwatcher">
<meta property="og:description" content="Every DraftKings CFB and NFL line, graded by Ballwatcher's models. Updated every 30 minutes.">
<meta property="og:url" content="https://ballwatcher.com/screener/">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#0B0E13">
<link rel="icon" href="/assets/img/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0E13; --panel:#121720; --panel2:#171d27; --ink:#E8ECF2; --muted:#8A94A6; --line:#222A36; --chip:#1A212C;
  --amber:#FFB020; --amber-bg:rgba(255,176,32,.12); --win:#4ADE9B; --win-bg:rgba(74,222,155,.12); --loss:#FF7A7A; --loss-bg:rgba(255,122,122,.12);
  --lotto:#C9A2FF; --lotto-bg:rgba(201,162,255,.12); --pass:#6B7587; --row-hover:#161C26; --shadow:0 1px 0 rgba(255,255,255,.02) inset,0 10px 30px rgba(0,0,0,.35);
  --display:"Barlow Condensed",Impact,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--body)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:var(--amber);text-decoration:none} a:hover{text-decoration:underline}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
/* site bar (matches ballwatcher.com) */
.sitebar{border-bottom:1px solid var(--line);background:rgba(11,14,19,.92);backdrop-filter:blur(8px);position:sticky;top:0;z-index:5}
.sitebar .wrap{display:flex;align-items:center;gap:22px;height:58px}
.brand{display:flex;align-items:center;gap:9px;color:var(--ink);font:800 24px/1 var(--display);letter-spacing:.6px;text-transform:uppercase}
.brand:hover{text-decoration:none}
.brand img,.brand svg{width:28px;height:28px}
.nav{display:flex;gap:18px;margin-left:auto;overflow-x:auto}
.nav a{color:var(--muted);font:600 13px var(--mono);letter-spacing:.8px;text-transform:uppercase;white-space:nowrap;padding:4px 0;border-bottom:2px solid transparent}
.nav a:hover{color:var(--ink);text-decoration:none}
.nav a.on{color:var(--amber);border-bottom-color:var(--amber)}
/* page header */
.hero{padding-top:26px;padding-bottom:8px}
.kicker{font:600 12px var(--mono);letter-spacing:1.4px;text-transform:uppercase;color:var(--amber)}
h1{font:800 46px/1 var(--display);letter-spacing:.5px;margin:6px 0 6px;text-transform:uppercase}
.lede{color:var(--muted);max-width:760px;margin:0}
.metarow{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:12px;font:500 12px var(--mono);color:var(--muted)}
.pill{border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--panel)}
.pill b{color:var(--ink);font-weight:600}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--win);margin-right:6px;box-shadow:0 0 0 3px rgba(74,222,155,.18)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:16px 0 4px}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;font:600 13px var(--mono);letter-spacing:.4px}
.tab[aria-selected="true"]{background:var(--amber);color:#14110A;border-color:var(--amber)}
.tab small{opacity:.75;margin-left:6px;font-weight:500}
main{padding:12px 0 40px}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0 6px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .k{color:var(--muted);font:500 11px var(--mono);text-transform:uppercase;letter-spacing:1px}
.stat .v{font:800 32px/1.05 var(--display);margin-top:2px}
.stat.play .v{color:var(--win)} .stat.lean .v{color:var(--amber)}
h2{font:800 24px/1 var(--display);text-transform:uppercase;letter-spacing:.6px;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:4px;height:20px;background:var(--amber);border-radius:2px}
.best{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:10px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-top:3px solid var(--win);border-radius:12px;padding:12px 14px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.card:hover{transform:translateY(-2px);border-color:#2E3846}
.card .tag{font:600 10.5px var(--mono);letter-spacing:1px;color:var(--win);text-transform:uppercase}
.card .pick{font:800 26px/1.05 var(--display);letter-spacing:.3px;margin-top:2px}
.card .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.card .why{font-size:12.5px;margin-top:7px;color:#C6CDD8}
.card .why.mono{font-size:11.5px;color:var(--muted)}
.empty{color:var(--muted);padding:12px 0}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);color:var(--muted);padding:8px 12px;cursor:pointer;font:600 12px var(--mono);letter-spacing:.4px;text-transform:uppercase;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--chip);color:var(--amber)}
input[type=search]{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 11px;font:inherit;min-width:190px}
input[type=search]:focus,.seg button:focus-visible,.tab:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
label.chk{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px;cursor:pointer}
label.chk input{accent-color:var(--amber)}
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:auto;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:1060px}
th,td{padding:10px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font:600 10.5px var(--mono);letter-spacing:1px;text-transform:uppercase;color:var(--muted);position:sticky;top:0;background:var(--panel);z-index:1;white-space:nowrap}
th.grp{border-bottom:0;text-align:center;color:var(--amber);padding-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--row-hover)}
td.num{text-align:right}
td.mono:first-child{white-space:nowrap;color:var(--muted)}
.team{font-weight:600}
.rank{color:var(--muted);font:500 10.5px var(--mono);margin-right:4px}
.at{color:var(--muted);margin:0 5px}
.mv{color:var(--muted);font-size:10.5px;display:block}
.gr{display:inline-block;font:600 10.5px/1 var(--mono);letter-spacing:.8px;padding:5px 7px;border-radius:4px;min-width:44px;text-align:center}
.gr.PLAY{background:var(--win-bg);color:var(--win);border:1px solid rgba(74,222,155,.35)}
.gr.LEAN{background:var(--amber-bg);color:var(--amber);border:1px solid rgba(255,176,32,.35)}
.gr.PASS{color:var(--pass);background:transparent;border:1px solid var(--line)}
.gr.FLAG{background:var(--lotto-bg);color:var(--lotto);border:1px solid rgba(201,162,255,.3)}
.pk{font-weight:600;margin-left:7px;white-space:nowrap}
.adj{color:var(--loss);font-size:11px;display:block;margin-top:3px}
.edge{font-size:11.5px;color:var(--muted)}
.wx{font-size:12px;color:var(--muted);max-width:120px}
.mlist{display:none}
@media (max-width:820px){
  h1{font-size:36px}
  .sitebar .wrap{gap:12px}
  .nav{gap:12px}
  .brand{font-size:21px}
  .nav a:not(.on):not(.keep){display:none}
  .summary{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tablewrap{display:none}
  .mlist{display:grid;gap:10px}
  .mg{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
  .mg .row1{display:flex;justify-content:space-between;color:var(--muted);font:500 11.5px var(--mono)}
  .mg .teams{font-weight:600;font-size:15px;margin:4px 0 8px}
  .mg .lines{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mg .box{background:var(--chip);border-radius:8px;padding:8px}
  .mg .box .k{font:500 10.5px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:2px}
}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.2s;z-index:9}
.scrim.on{opacity:1;pointer-events:auto}
aside{position:fixed;top:0;right:0;height:100%;width:min(720px,100%);background:var(--bg);border-left:1px solid var(--line);
  transform:translateX(100%);transition:transform .22s ease;overflow:auto;z-index:10;box-shadow:-20px 0 50px rgba(0,0,0,.5)}
aside.on{transform:none}
.dh{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:flex-start;gap:12px;z-index:2}
.dh h3{font:800 28px/1.02 var(--display);margin:0;text-transform:uppercase;letter-spacing:.4px}
.dh .sub{color:var(--muted);font-size:12px;margin-top:4px}
.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit}
.dh .x{margin-left:auto}
.db{padding:14px 18px 40px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.panel h4{margin:0 0 8px;font:600 10.5px var(--mono);letter-spacing:1px;text-transform:uppercase;color:var(--amber)}
.cmp{width:100%;min-width:0;font-size:13px}
.cmp th,.cmp td{padding:6px 6px;position:static;background:transparent}
.cmp td.num{font-family:var(--mono)}
.better{color:var(--win);font-weight:600}
ul.notes{margin:0;padding-left:18px}
ul.notes li{margin:3px 0}
.res{display:flex;flex-wrap:wrap;gap:4px}
.res span{font:500 11px var(--mono);padding:3px 6px;border-radius:4px;background:var(--chip)}
.res span.W{border-left:3px solid var(--win)} .res span.L{border-left:3px solid var(--loss)}
svg.chart{width:100%;height:150px;display:block}
footer{color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);padding:22px 0 44px;margin-top:10px}
footer p{max-width:920px}
footer .legal{font:500 11.5px var(--mono);letter-spacing:.3px;color:#6E788A}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
/* sport tabs */
.sports{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px;border-bottom:1px solid var(--line)}
.sport{background:transparent;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:8px 14px 9px;cursor:pointer;
  font:800 22px/1 var(--display);letter-spacing:.6px;text-transform:uppercase;margin-bottom:-1px}
.sport:hover{color:var(--ink)}
.sport[aria-selected="true"]{color:var(--amber);border-bottom-color:var(--amber)}
.sport[disabled]{cursor:default;opacity:.45}
.sport small{font:600 9.5px var(--mono);letter-spacing:.8px;margin-left:6px;vertical-align:middle;color:var(--muted)}
.sport:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.gr.TARGET{background:var(--win-bg);color:var(--win);border:1px solid rgba(74,222,155,.35)}
.gr.WATCH{background:var(--amber-bg);color:var(--amber);border:1px solid rgba(255,176,32,.35)}
.gr.CHECK{background:var(--lotto-bg);color:var(--lotto);border:1px dashed rgba(201,162,255,.45)}
.pk.lean{color:var(--muted);font-weight:500}
.adj.info{color:var(--lotto)}
.angle{color:var(--muted)}
th.ang,td.ang{background:rgba(201,162,255,.04)}
th.grp.ang{color:var(--lotto)}
.note{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--lotto);border-radius:10px;padding:10px 12px;color:#C6CDD8;font-size:13px;margin:12px 0}
.note b{color:var(--ink)}
.track{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.track .stat .v{font-size:24px}
.track .stat .s{color:var(--muted);font:500 11.5px var(--mono);margin-top:2px}
@media (max-width:820px){.track{grid-template-columns:repeat(2,minmax(0,1fr))}.sport{font-size:19px;padding:8px 10px}}
/* views (Lines | Props) */
.views{display:inline-flex;margin-top:14px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.views button{border:0;background:var(--panel);color:var(--muted);padding:9px 18px;cursor:pointer;font:700 15px var(--display);letter-spacing:.8px;text-transform:uppercase;border-right:1px solid var(--line)}
.views button:last-child{border-right:0}
.views button[aria-pressed="true"]{background:var(--amber);color:#14110A}
.views button:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
/* prop cards */
.pfilters{display:flex;flex-direction:column;gap:8px;margin:14px 0 10px}
.pfilters .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pfilters .seg{flex-wrap:wrap}
select.sel{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit}
.gamehd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin:22px 0 8px;font:800 20px/1 var(--display);text-transform:uppercase;letter-spacing:.5px}
.gamehd small{font:500 12px var(--mono);color:var(--muted);text-transform:none;letter-spacing:0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,560px),1fr));gap:10px}
.pc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.pc.dis{border-left:3px solid var(--lotto)}
.pc .top{display:flex;gap:10px;align-items:center}
.pc .hs{width:44px;height:44px;border-radius:50%;background:var(--chip);object-fit:cover;flex:none;display:grid;place-items:center;font:700 14px var(--display);color:var(--muted);overflow:hidden}
.pc .nm{font:800 21px/1.05 var(--display);text-transform:uppercase;letter-spacing:.3px}
.pc .sub{color:var(--muted);font:500 11.5px var(--mono);margin-top:2px}
.role{display:inline-block;font:600 10.5px/1 var(--mono);letter-spacing:.8px;padding:4px 6px;border-radius:4px;background:var(--chip);color:var(--amber);margin-left:6px;vertical-align:middle}
.inj{display:inline-block;font:600 10.5px/1 var(--mono);padding:4px 6px;border-radius:4px;background:var(--loss-bg);color:var(--loss);margin-left:6px;vertical-align:middle}
.pc .facts{display:flex;flex-wrap:wrap;gap:4px 14px;margin:9px 0 8px;font:500 12px var(--mono);color:#C6CDD8}
.pc .facts span b{color:var(--ink)}
.tierwrap{overflow-x:auto;margin:0 -4px}
table.tiers{border-collapse:separate;border-spacing:3px;width:100%;min-width:0;font:500 12px var(--mono)}
table.tiers th,table.tiers td{position:static;background:transparent;border:0;padding:5px 4px;text-align:center;white-space:nowrap}
table.tiers th{color:var(--ink);font:700 12px var(--mono)}
table.tiers td.lab{text-align:left;color:var(--muted);font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;padding-right:6px}
table.tiers td.c{border-radius:5px;background:var(--chip)}
td.c.r4{background:rgba(74,222,155,.34);color:#E9FFF4}td.c.r3{background:rgba(74,222,155,.18)}td.c.r2{background:rgba(255,176,32,.12)}td.c.r1{background:rgba(255,122,122,.10);color:#C9AFAF}td.c.r0{background:rgba(255,122,122,.18);color:#D8B5B5}
td.c.na{background:transparent;color:#4C5566}
tr.model td.c{background:transparent;border:1px solid var(--line)}
tr.model td.c.r4{border-color:rgba(74,222,155,.6);color:var(--win)}tr.model td.c.r3{border-color:rgba(74,222,155,.35)}
tr.fairr td{color:var(--muted);font-size:11px}
tr.sep td{padding:0;height:4px}
.pc .flags{margin-top:8px;color:var(--lotto);font-size:12px}
.pc .flags div::before{content:"⚑ "}
.pc .why{margin-top:6px;color:var(--muted);font-size:11.5px}
/* props table */
.ptw{margin-top:4px}
table.ptable{min-width:0;width:100%;font-size:13px}
table.ptable th{cursor:pointer;user-select:none}
table.ptable th:hover{color:var(--ink)}
table.ptable th.tc,table.ptable td.tc{text-align:center;padding:6px 3px;white-space:nowrap}
table.ptable td.mono{white-space:nowrap}
table.ptable td{padding:7px 8px}
table.ptable tbody tr{cursor:default}
table.ptable .first{position:sticky;left:0;z-index:2;background:var(--panel);white-space:nowrap}
table.ptable th.first{z-index:3}
table.ptable td.tc .c{display:inline-block;min-width:46px;padding:4px 5px;border-radius:5px;font:500 12px var(--mono);background:var(--chip)}
table.ptable td.tc .c.m{background:transparent;border:1px solid var(--line)}
table.ptable td.tc .c.m.r4{border-color:rgba(74,222,155,.6);color:var(--win)}table.ptable td.tc .c.m.r3{border-color:rgba(74,222,155,.35)}
table.ptable td.tc small{display:block;color:var(--muted);font:500 10px var(--mono);margin-top:2px}
.c.r4{background:rgba(74,222,155,.34);color:#E9FFF4}.c.r3{background:rgba(74,222,155,.18)}.c.r2{background:rgba(255,176,32,.12)}.c.r1{background:rgba(255,122,122,.10);color:#C9AFAF}.c.r0{background:rgba(255,122,122,.18);color:#D8B5B5}.c.na{background:transparent;color:#4C5566}
.tflag{color:var(--lotto);font-size:11px;margin-left:2px}
@media (max-width:820px){.ptw{display:block}table.ptable .opt{display:none}table.ptable td{padding:7px 6px}table.ptable .first{max-width:130px;overflow:hidden;text-overflow:ellipsis}}
/* bet slip (admin only) */
.addb{border:1px solid var(--line);background:var(--chip);color:var(--amber);border-radius:6px;padding:2px 7px;margin-left:6px;cursor:pointer;font:600 12px var(--mono);line-height:1.4;vertical-align:middle}
.addb:hover{border-color:var(--amber)}
.addb.on{background:var(--amber);color:#14110A;border-color:var(--amber)}
.addb:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.addrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.addrow .addb{margin-left:0;padding:5px 9px}
tr.addtr td{padding-top:4px}tr.addtr .addb{margin-left:0}
table.ptable td.tc .addb{display:block;margin:3px auto 0;padding:0 6px}
.tray{position:fixed;right:16px;bottom:16px;z-index:8;width:min(440px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.tray.empty:not(.open){width:auto}
.trayhd{display:flex;gap:8px;align-items:center;width:100%;background:transparent;border:0;color:var(--ink);padding:11px 14px;cursor:pointer;font:800 18px var(--display);text-transform:uppercase;letter-spacing:.5px}
.trayhd b{background:var(--amber);color:#14110A;border-radius:999px;padding:0 8px;font:700 13px var(--mono)}
.trayhd span{font:500 11px var(--mono);color:var(--win);text-transform:none;letter-spacing:0}
.trayhd i{margin-left:auto;font-style:normal;color:var(--muted)}
.traybd{border-top:1px solid var(--line);padding:10px 12px 12px;max-height:60vh;overflow:auto}
.titem{display:grid;grid-template-columns:1fr 78px auto auto;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.tpick{font-weight:600}.tsub{color:var(--muted);font:500 11px var(--mono)}
.todds{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:5px 6px;font:500 12px var(--mono)}
.tbtn{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:6px;padding:6px 9px;cursor:pointer;font:600 11.5px var(--mono);white-space:nowrap}
.tbtn.main{background:var(--amber);color:#14110A;border-color:var(--amber)}.tbtn.ghost{background:transparent;color:var(--muted)}
.tx{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:14px}
.tfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}

<body>
<div class="sitebar"><div class="wrap">
  <a class="brand" href="https://ballwatcher.com/" aria-label="Ballwatcher home">
    <img src="/assets/img/icon.svg" alt="" onerror="this.outerHTML='<svg viewBox=&quot;0 0 32 32&quot; aria-hidden=&quot;true&quot;><path d=&quot;M2 16c3.6-6.2 8.6-9.3 14-9.3S26.4 9.8 30 16c-3.6 6.2-8.6 9.3-14 9.3S5.6 22.2 2 16Z&quot; fill=&quot;none&quot; stroke=&quot;#FFB020&quot; stroke-width=&quot;2.4&quot;/><circle cx=&quot;16&quot; cy=&quot;16&quot; r=&quot;5.2&quot; fill=&quot;#FFB020&quot;/></svg>'">
    Ballwatcher</a>

<header class="wrap hero">
  <div class="kicker" id="kicker">DraftKings lines</div>
  <h1 id="title">Screener</h1>

  <div class="views" id="views" role="group" aria-label="View" hidden></div>

</header>
<main class="wrap">
  <div id="early"></div>
  <div id="propsView" hidden></div>
  <div id="linesView">

  <h2>Full slate</h2>

      <button data-v="both" aria-pressed="true">Sides & totals</button>

  </div>
</main>

<footer class="wrap">
  <div id="how"></div>
  <p class="legal">21+ · Gambling problem? Call 1-800-GAMBLER · Ballwatcher is not affiliated with DraftKings · Odds: DraftKings at time of pull</p>
</footer>

<div class="scrim" id="scrim"></div>
<aside id="drawer" aria-hidden="true"></aside>

<script>
const $ = s => document.querySelector(s);
const fmt = (x, d = 1) => x == null ? "—" : (+x).toFixed(d).replace(/\.0+$/, "");
const sgn = x => x == null ? "—" : (x > 0 ? "+" : "") + fmt(x);
const pct = x => x == null ? "—" : (x * 100).toFixed(0) + "%";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago = iso => { if (!iso) return "—"; const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m/60)} hr ago` : new Date(iso).toLocaleString(); };

// Data lives in the GitHub repo and refreshes every ~30 min. On ballwatcher.com read it straight from
// GitHub; inside the repo (GitHub Pages / local preview) read it relatively.
const REPO_RAW = "https://raw.githubusercontent.com/tdfarrell/betting-research/main/";
const DATA = /github\.io$|^localhost$|^127\./.test(location.hostname) ? "../" : REPO_RAW;
const bust = () => "?t=" + Math.floor(Date.now() / 60000);
async function getJSON(u) { const r = await fetch(DATA + u + bust()); if (!r.ok) throw new Error(u + " " + r.status); return r.json(); }

function dayLabel(d) { return new Date(d + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }); }
function cmpRow(label, a, h, f, higherBetter) {
  let ca = "", ch = "";
  if (a != null && h != null && a !== h && higherBetter != null) { const ab = higherBetter ? a > h : a < h; ca = ab ? "better" : ""; ch = ab ? "" : "better"; }
  return `<tr><td>${label}</td><td class="num ${ca}">${f(a)}</td><td class="num ${ch}">${f(h)}</td></tr>`;
}
const sect = t => `<tr><td colspan="3" class="edge" style="padding-top:10px">${t}</td></tr>`;
function gradeCell(m, g, k) {
  const chk = m.grade === "CHECK";
  const adj = (m.adjust || []).map(a => chk ? `<span class="adj info">? Big gap — check news first</span>` : `<span class="adj">↓ ${esc(a)}</span>`).join("");
  return `<span class="gr ${m.grade}">${m.grade}</span>${m.pick ? `<span class="pk${chk ? " lean" : ""}">${chk ? "lean " : ""}${esc(m.pick)}</span>${pickAdd(m, g, k)}` : ""}${adj}`;
}
const moveTxt = (open, now, f = sgn) => open == null || now == null || open === now ? "" : `<span class="mv">open ${f(open)}</span>`;

/* ------------------------------------------------------------------ sports
   Each sport says where its data lives, what its slates and grades are called, and how to draw its
   table row and game drawer. Adding NBA / CBB later = adding an entry here (+ a grader in the repo). */
const SPORTS = {
  cfb: {
    label: "CFB", kicker: "College Football · DraftKings lines", title: "CFB Screener",
    lede: "Every DraftKings line on the slate, graded by SP+, Elo and a per-play model, with EPA matchup notes and line movement. Updated automatically about every 30 minutes.",
    index: "data/boards/index.json", history: "data/odds/history_cfb.csv",
    slateKey: s => s.date, slateFile: k => `data/boards/cfb_${k}.json`,
    tabLabel: s => `${dayLabel(s.date)}<small>${s.games} games</small>`,
    defaultSlate(slates) { const t = new Date(Date.now() - 4 * 3600e3).toISOString().slice(0, 10); const up = slates.filter(s => s.date >= t);
      return (up.sort((a, b) => b.games - a.games)[0] || slates[slates.length - 1]).date; },
    grades: ["PLAY", "LEAN"], topWord: "Plays", bothWord: "Plays + Leans", bestTitle: "Best bets", stats: ["Plays", "Leans"],
    head: `<tr><th></th><th></th><th class="grp" colspan="4">Spread (home line)</th><th class="grp" colspan="4">Total</th><th></th></tr>
      <tr><th>Kick (ET)</th><th>Matchup</th><th class="num">DK</th><th class="num">SP+</th><th class="num">Elo</th><th>Grade</th>
      <th class="num">DK</th><th class="num">SP+</th><th class="num">Per-play</th><th>Grade</th><th>Weather</th></tr>`,
    cols: 11,
    rank: (T, t) => T[t].sp_rank,
    row(g, T) { const d = g.dk, m = g.model; return `
      <td class="num mono">${sgn(d.home_spread)}${moveTxt(d.home_spread_open, d.home_spread)}</td>
      <td class="num mono">${sgn(m.sp_spread_cal)}</td><td class="num mono">${sgn(m.elo_spread_cal)}</td><td>${gradeCell(g.side, g, "side")}</td>
      <td class="num mono">${fmt(d.total)}${moveTxt(d.total_open, d.total, fmt)}</td>
      <td class="num mono">${fmt(m.sp_total_cal)}</td><td class="num mono">${fmt(m.pp_total_cal)}</td><td>${gradeCell(g.total, g, "total")}</td>
      <td class="wx">${esc(g.weather || "")}${g.temp_f != null ? ` ${g.temp_f}°` : ""}</td>`; },
    mobile(g) { const d = g.dk, m = g.model; return [
      `SP+ ${sgn(m.sp_spread_cal)} · Elo ${sgn(m.elo_spread_cal)}`, `SP+ ${fmt(m.sp_total_cal)} · PP ${fmt(m.pp_total_cal)}`]; },
    cardWhy(g, k) { const m = g[k], d = g.dk; return k === "side" ? `Value vs DK: SP+ ${fmt(Math.abs(m.edge_sp))} · Elo ${fmt(Math.abs(m.edge_elo))} pts`
      : `SP+ ${fmt(g.model.sp_total_cal)} · per-play ${fmt(g.model.pp_total_cal)} vs DK ${fmt(d.total)}`; },
    drawer: cfbDrawer,
    how: () => `<p><b>How grades work.</b> SP+ and Elo spreads (and the SP+ and per-play totals) are put on DraftKings' scale using each slate's own lines, fitted so that an edge can't be predicted from the size of the line — favorites and underdogs, overs and unders all get an even shot. Gaps are measured against the slate's <b>usual gap</b> between the models and DK. <b style="color:var(--win)">PLAY</b>: the two models' average is 1–2× the usual gap from DK and both are on the same team (each 1+ point). <b style="color:var(--amber)">LEAN</b>: 0.6–1× the usual gap. <b style="color:var(--lotto)">CHECK</b>: 2×+ the usual gap — shown as a lean only, because gaps that big usually mean QB or injury news the models don't have. <b>Totals</b>: both totals models must clear the same bands on their own, in the same direction. <b style="color:var(--loss)">Downgrades</b>: line moved 2+ points toward the other side since open; overs where the total fell 5+ on a rain forecast. Spreads of 25+ and option offenses are flagged, not graded.</p>
      <p><b>Honesty note:</b> a 2022–25 backtest with pre-game Elo (past SP+ is only published as end-of-season ratings, which would leak results) ran about 50% against the line at every gap size. The new fit makes the card balanced; it doesn't prove an edge.</p>
      <p>Data: DraftKings lines via ESPN's public scoreboard; SP+, EPA, success rate, Elo and results via CollegeFootballData.com. Models don't know about injuries or weather — check both, and always confirm the current price in the DraftKings app. This is a research tool, not a pick; Ballwatcher's actual plays are on <a href="https://ballwatcher.com/today">Today's Card</a>.</p>`,
  },
  nfl: {
    label: "NFL", kicker: "NFL · DraftKings lines", title: "NFL Screener",
    lede: "Every DraftKings NFL line graded on this season's play-by-play: EPA, success rate and points ratings, adjusted for opponent and quarterback. Last season, Elo and the market rating are shown as angles only. Updated about every 30 minutes.",
    index: "data/boards/nfl_index.json", history: "data/odds/history_nfl.csv",
    slateKey: s => s.key, slateFile: k => `data/boards/nfl_${k}.json`,
    tabLabel: s => `${s.label}<small>${s.games} games</small>`,
    defaultSlate(slates) { const t = new Date(Date.now() - 4 * 3600e3).toISOString().slice(0, 10);
      const up = slates.filter(s => s.first_day >= t || s.games > 1).filter(s => s.first_day >= addDays(t, -6));
      return (up.sort((a, b) => b.games - a.games || a.key.localeCompare(b.key))[0] || slates[slates.length - 1]).key; },
    grades: ["TARGET", "WATCH"], topWord: "Targets", bothWord: "Targets + Watch", bestTitle: "Targets", stats: ["Targets", "Watch list"],
    head: `<tr><th></th><th></th><th class="grp" colspan="6">Spread (home line) · this season</th><th class="grp ang" colspan="2">Angles</th><th class="grp" colspan="5">Total</th><th></th></tr>
      <tr><th>Kick (ET)</th><th>Matchup</th><th class="num">DK</th><th class="num">BW #</th><th class="num">EPA</th><th class="num">Succ.</th><th class="num">Pts</th><th>Grade</th>
      <th class="num ang">Last yr</th><th class="num ang">Elo</th>
      <th class="num">DK</th><th class="num">BW</th><th class="num">EPA</th><th class="num">Pts</th><th>Grade</th><th>Weather</th></tr>`,
    cols: 16,
    rank: (T, t) => T[t].net_rank,
    row(g, T) { const d = g.dk, m = g.model; return `
      <td class="num mono">${sgn(d.home_spread)}${moveTxt(d.home_spread_open, d.home_spread)}</td>
      <td class="num mono"><b>${sgn(m.number)}</b></td><td class="num mono">${sgn(m.epa_spread)}</td><td class="num mono">${sgn(m.sr_spread)}</td><td class="num mono">${sgn(m.pts_spread)}</td>
      <td>${gradeCell(g.side, g, "side")}${(g.side.keys || []).length ? `<span class="mv">crosses ${g.side.keys.join(" & ")}</span>` : ""}</td>
      <td class="num mono ang angle">${sgn(m.last_spread)}</td><td class="num mono ang angle">${sgn(m.elo_spread)}</td>
      <td class="num mono">${fmt(d.total)}${moveTxt(d.total_open, d.total, fmt)}</td>
      <td class="num mono"><b>${fmt(m.total_number)}</b></td><td class="num mono">${fmt(m.epa_total)}</td><td class="num mono">${fmt(m.pts_total)}</td><td>${gradeCell(g.total, g, "total")}</td>
      <td class="wx">${esc(nflWx(g))}</td>`; },
    mobile(g) { const m = g.model; return [
      `BW ${sgn(m.number)} · EPA ${sgn(m.epa_spread)} · SR ${sgn(m.sr_spread)} · Pts ${sgn(m.pts_spread)}<br><span class="angle">Last yr ${sgn(m.last_spread)} · Elo ${sgn(m.elo_spread)}</span>`,
      `BW ${fmt(m.total_number)} · EPA ${fmt(m.epa_total)} · Pts ${fmt(m.pts_total)}`]; },
    cardWhy(g, k) { const m = g.model, d = g.dk; return k === "side"
      ? `BW ${esc(g.home_abbr)} ${sgn(m.number)} vs DK ${sgn(d.home_spread)} · EPA ${sgn(m.epa_spread)} · SR ${sgn(m.sr_spread)} · Pts ${sgn(m.pts_spread)}`
      : `BW total ${fmt(m.total_number)} vs DK ${fmt(d.total)} · EPA ${fmt(m.epa_total)} · points ${fmt(m.pts_total)}`; },
    drawer: nflDrawer, extra: nflTrack, early: nflEarly, props: true,
    how: () => `<p><b>How grades work.</b> Grades use <b>this season only</b>: three ratings built from this season's play-by-play — EPA per play, success rate and points scored/allowed — each adjusted for opponent and for the projected starting quarterback, fitted to recent closing lines, and averaged into the <b>BW number</b>. Last season only seeds the ratings early (full weight in Week 1, fading to zero by Week 6) because rosters and coaching staffs change too much year to year. The ratings are put on DraftKings' scale so that an edge can't be predicted from the size of the line — favorites and underdogs, overs and unders all get an even shot. Gaps are measured against the <b>usual gap</b> between the BW number and the close lately (about 4 points early in the season, 3 later), so a tier means the same thing in Week 4 as in Week 14. <b style="color:var(--amber)">WATCH</b>: 0.3–0.6× the usual gap and at least two ratings agree (each 1+ point, same team). <b style="color:var(--win)">TARGET</b>: 0.6–1.0× the usual gap, at least two agree. <b style="color:var(--lotto)">CHECK</b>: bigger than the usual gap — in the backtest these lost against the close every season, because the market usually knows something the model doesn't (injury, QB, news); shown as a lean only. <b>Totals</b>: an EPA × pace projection and a points-rating projection, averaged into the BW total; TARGET when both miss DK by 1.5+ the same way and the BW total is 2–4.5 off, WATCH at 1.5–2, CHECK at 4.5+. <b style="color:var(--loss)">Downgrades</b>: line moved 2+ toward the other side since open; overs in 15+ mph wind or rain with a falling total. If a projected starting QB is questionable, doubtful or out, the game is flagged and not graded.</p>
      <p><b style="color:var(--lotto)">Angles</b> — last season's rating, multi-season Elo and the market rating — are context only and never change a grade. <b>Honesty note:</b> backtested 2022–25 against closing lines, side WATCHes and TARGETs have run 55–59% and CHECK leans 44%; totals have shown no edge yet (about 50% in every band). Samples are a few hundred games, so every TARGET, WATCH and CHECK is logged at the DraftKings line when first flagged and graded on closing-line value in the Track record above.</p>
      <p>Data: DraftKings lines via ESPN's public scoreboard; play-by-play, schedules, projected starters and injury reports via nflverse. Always check final inactives and confirm the current price in the DraftKings app. Research tool, not a pick; Ballwatcher's actual plays are on <a href="https://ballwatcher.com/today">Today's Card</a>.</p>`,
  },
  nba: { label: "NBA", soon: true },
  cbb: { label: "CBB", soon: true },
};
function addDays(d, n) { const x = new Date(d + "T12:00:00"); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); }
function nflWx(g) { if (g.roof === "dome" || g.roof === "closed") return "Dome"; return `${g.weather || ""}${g.temp_f != null ? ` ${g.temp_f}°` : ""}`; }

const state = { sport: null, index: null, slate: null, key: null, grade: "all", mkt: "both", q: "", hideFlag: false, history: {},
  view: "lines", props: null, pf: { mk: "rec_yds", role: "all", game: "all", q: "", dis: false, layout: "cards", metric: "p", sort: null, dir: -1 } };
const S = () => SPORTS[state.sport];

function hashParams() { return new URLSearchParams(location.hash.slice(1)); }
function setHash() { try { history.replaceState(null, "", `#s=${state.sport}&k=${encodeURIComponent(state.key || "")}${state.view === "props" ? "&v=props" : ""}`); } catch (e) {} }

function drawSports() {
  $("#sports").innerHTML = Object.entries(SPORTS).map(([k, s]) =>
    `<button class="sport" role="tab" data-s="${k}" aria-selected="${k === state.sport}" ${s.soon ? "disabled" : ""}>${s.label}${s.soon ? "<small>Soon</small>" : ""}</button>`).join("");
}
$("#sports").onclick = e => { const b = e.target.closest(".sport"); if (b && !b.disabled && b.dataset.s !== state.sport) setSport(b.dataset.s); };

async function setSport(sp, key, view) {
  state.sport = sp; state.key = null; state.index = null; state.slate = null; state.props = null;
  const s = S();
  state.view = s.props && view === "props" ? "props" : "lines";
  drawSports(); drawViews();
  $("#kicker").textContent = s.kicker; $("#title").textContent = s.title; $("#lede").textContent = s.lede;
  document.title = `${s.title} | Ballwatcher`;
  $("#bestTitle").textContent = s.bestTitle; $("#fTop").textContent = s.topWord; $("#fBoth").textContent = s.bothWord;
  $("#tbl thead").innerHTML = s.head; $("#how").innerHTML = s.how();
  $("#tabs").innerHTML = ""; $("#summary").innerHTML = ""; $("#best").innerHTML = ""; $("#trackWrap").innerHTML = ""; $("#early").innerHTML = "";
  $("#tbl tbody").innerHTML = `<tr><td colspan="${s.cols}" class="empty">Loading…</td></tr>`; $("#mlist").innerHTML = "";
  $("#meta").innerHTML = `<span class="pill">Loading…</span>`;
  try {
    state.index = await getJSON(s.index);
  } catch (err) {
    $("#meta").innerHTML = `<span class="pill">Couldn't load ${esc(s.label)} data (${esc(err.message)}). Refresh in a minute.</span>`;
    $("#tbl tbody").innerHTML = ""; return;
  }
  if (sp !== state.sport) return;
  const slates = state.index.slates || [];
  if (!slates.length) { $("#meta").innerHTML = `<span class="pill">No ${esc(s.label)} games on the DraftKings board right now.</span>`; $("#tbl tbody").innerHTML = ""; return; }
  $("#tabs").innerHTML = slates.map(x => `<button class="tab" role="tab" data-k="${esc(s.slateKey(x))}">${s.tabLabel(x)}</button>`).join("");
  const want = key && slates.some(x => s.slateKey(x) === key) ? key : s.defaultSlate(slates);
  await load(want);
}
$("#tabs").onclick = e => { const b = e.target.closest(".tab"); if (b) load(b.dataset.k); };

async function load(key) {
  const sp = state.sport, s = S();
  state.key = key; setHash();
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.k === key));
  $("#linesView").hidden = state.view === "props"; $("#propsView").hidden = state.view !== "props"; $("#how").hidden = state.view === "props";
  if (state.view === "props") return loadProps(key);
  const slate = await getJSON(s.slateFile(key));
  if (sp !== state.sport || key !== state.key) return;
  state.slate = slate;
  const statsAt = slate.cfbd_pulled_utc || slate.stats_pulled_utc;
  $("#meta").innerHTML = `<span class="pill"><span class="dot"></span>DK lines <b>${ago(slate.odds_pulled_utc)}</b></span><span class="pill">Model stats <b>${ago(statsAt)}</b></span><span class="pill">Graded <b>${ago(slate.generated_utc)}</b></span>`;
  $("#early").innerHTML = s.early ? s.early(slate) : "";
  $("#trackWrap").innerHTML = s.extra ? s.extra(state.index) : "";
  render();
}

function render() {
  const s = S(), sl = state.slate, games = sl.games, [G1, G2] = s.grades;
  const c = { [G1]: 0, [G2]: 0 };
  games.forEach(x => [x.side, x.total].forEach(m => { if (c[m.grade] != null) c[m.grade]++; }));
  $("#summary").innerHTML = `
    <div class="stat"><div class="k">Games graded</div><div class="v">${games.length}</div></div>
    <div class="stat play"><div class="k">${s.stats[0]}</div><div class="v">${c[G1]}</div></div>
    <div class="stat lean"><div class="k">${s.stats[1]}</div><div class="v">${c[G2]}</div></div>
    <div class="stat"><div class="k">${s.stats[0]}: sides · totals</div><div class="v">${games.filter(g => g.side.grade === G1).length} · ${games.filter(g => g.total.grade === G1).length}</div></div>`;
  const items = [];
  for (const g of games) for (const k of ["side", "total"]) if (g[k].grade === G1) items.push({ g, k });
  $("#best").innerHTML = items.length ? items.map(({ g, k }) => `<div class="card" data-id="${g.id}">
      <div class="tag">${G1 === "PLAY" ? "Play" : "Target"} · ${k === "side" ? "Spread" : "Total"}</div>
      <div class="pick">${esc(g[k].pick)}</div>
      <div class="sub">${esc(g.away)} ${g.neutral ? "vs" : "@"} ${esc(g.home)} · ${g.kick_et}</div>
      <div class="why mono">${s.cardWhy(g, k)}</div>
      ${g.notes[0] ? `<div class="why">${esc(g.notes[0])}</div>` : ""}</div>`).join("")
    : `<div class="empty">No ${s.topWord.toLowerCase()} on this slate yet.</div>`;
  const q = state.q.toLowerCase(), T = sl.teams;
  const rows = games.filter(g => {
    if (q && !(g.away + g.home + g.away_abbr + g.home_abbr + (g.away_name || "") + (g.home_name || "")).toLowerCase().includes(q)) return false;
    if (state.hideFlag && g.flags.length) return false;
    const mk = state.mkt === "both" ? ["side", "total"] : [state.mkt];
    if (state.grade === "top") return mk.some(k => g[k].grade === G1);
    if (state.grade === "both") return mk.some(k => g[k].grade === G1 || g[k].grade === G2);
    return true;
  });
  $("#tbl tbody").innerHTML = rows.map(g => `<tr data-id="${g.id}">
      <td class="mono">${g.kick_et}</td>

async function loadHistory() {
  const sp = state.sport;
  if (state.history[sp]) return state.history[sp];
  const H = {};
  try {
    const txt = await (await fetch(DATA + S().history + bust())).text();
    const [head, ...lines] = txt.trim().split("\n"); const cols = head.split(",");
    for (const ln of lines) { const v = ln.split(","); const o = {}; cols.forEach((c, i) => o[c] = v[i]); (H[o.game_id] = H[o.game_id] || []).push(o); }
  } catch (e) {}
  return state.history[sp] = H;
}

function lineChart(pts, key, label) {
  const P = pts.map(p => ({ t: new Date(p.pulled_utc), v: parseFloat(String(p[key]).replace(/^[ou]/, "")) })).filter(p => !isNaN(p.v) && !isNaN(p.t));
  if (P.length < 2) return `<div class="empty">${label}: line history builds up as the pipeline runs (every 30 min).</div>`;
  const W = 600, Hh = 130, pad = 28, xs = P.map(p => +p.t), ys = P.map(p => p.v);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys) - .5, y1 = Math.max(...ys) + .5;
  const X = t => pad + (W - pad * 2) * ((t - x0) / Math.max(1, x1 - x0)), Y = v => 10 + (Hh - 30) * (1 - (v - y0) / Math.max(.5, y1 - y0));
  let d = ""; P.forEach((p, i) => { const x = X(+p.t), y = Y(p.v); d += i ? ` H${x} V${y}` : `M${x} ${y}`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${label} history">
    <text x="${pad}" y="10" fill="var(--muted)" font-size="11">${label}</text>
    <path d="${d}" fill="none" stroke="var(--amber)" stroke-width="2"/>
    ${P.map(p => `<circle cx="${X(+p.t)}" cy="${Y(p.v)}" r="2.5" fill="var(--amber)"/>`).join("")}
    <text x="${W - pad}" y="${Y(P[P.length-1].v) - 6}" fill="var(--ink)" font-size="12" text-anchor="end">${P[P.length-1].v}</text>
    <text x="${pad}" y="${Hh - 4}" fill="var(--muted)" font-size="10">${P[0].t.toLocaleString([], {month:"short",day:"numeric",hour:"numeric"})}</text>
    <text x="${W - pad}" y="${Hh - 4}" fill="var(--muted)" font-size="10" text-anchor="end">${P[P.length-1].t.toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}</text>
  </svg>`;
}

  if (!state.propsIndex) { try { state.propsIndex = await getJSON("data/props/index.json"); } catch (e) { state.propsIndex = {}; } }
  $("#meta").innerHTML = `<span class="pill"><span class="dot"></span>Built <b>${ago(doc.generated_utc)}</b></span><span class="pill">DK lines (implied totals) <b>${ago(doc.odds_pulled_utc)}</b></span><span class="pill"><b>${doc.cards.length}</b> players</span>`;
  const games = [...new Map(doc.cards.map(c => [c.game_id, c])).values()].map(c => { const h = c.home ? c.team : c.opp, a = c.home ? c.opp : c.team; return [c.game_id, `${a} @ ${h}`]; });
  const bt = state.propsIndex && state.propsIndex.backtest;
  $("#propsView").innerHTML = `
    ${doc.prior_weight ? `<div class="note"><b>Early season:</b> Week ${doc.week} projections still use ${Math.round(doc.prior_weight * 100)}% of last season's starting point (gone by Week 6, and dropped for players who changed teams, QB or head coach, or whose target share moved 5+ points). Hit rates are this season only.</div>` : ""}
    <div class="pfilters">
      <div class="row"><div class="seg" id="pMk" role="group" aria-label="Market">${PMK.map(([k, l]) => `<button data-v="${k}" aria-pressed="${state.pf.mk === k}">${l}</button>`).join("")}</div></div>
      <div class="row">
        <div class="seg" id="pRole" role="group" aria-label="Role">${ROLES.map(r => `<button data-v="${r}" aria-pressed="${state.pf.role === r}">${r === "all" ? "All roles" : r}</button>`).join("")}</div>
        <select class="sel" id="pGame" aria-label="Game"><option value="all">All games</option>${games.map(([id, l]) => `<option value="${id}" ${state.pf.game === id ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>
        <input type="search" id="pQ" placeholder="Search player or team…" aria-label="Search player" value="${esc(state.pf.q)}">
        <label class="chk"><input type="checkbox" id="pDis" ${state.pf.dis ? "checked" : ""}> Hit rate vs model disagree</label>
      </div>
    </div>
    <div class="pfilters" style="margin-top:0"><div class="row">
      <div class="seg" id="pLayout" role="group" aria-label="Layout"><button data-v="cards" aria-pressed="${state.pf.layout === "cards"}">Cards</button><button data-v="table" aria-pressed="${state.pf.layout === "table"}">Table</button></div>
      <div class="seg" id="pMetric" role="group" aria-label="Tier cells show" ${state.pf.layout === "table" ? "" : "hidden"}>${PMETRIC.map(([k, l]) => `<button data-v="${k}" aria-pressed="${state.pf.metric === k}">${l}</button>`).join("")}</div>
      <span class="edge" id="pMetricHint" ${state.pf.layout === "table" ? "" : "hidden"}>Tier cells show · click a column to sort</span>
    </div></div>
    <div id="pList"></div>
    <div class="note" style="margin-top:18px"><b>Reading a card.</b> Each column is a DraftKings-style tier (hit = reached or beat it). <b>L3</b> = last 3 games, <b>Season</b> = this season, <b>Opp vs role</b> = what this week's defense has allowed to the same role (e.g. WR1s) this season. Roles are set entering each game by volume. <b>Model</b> = simulated probability from projected volume (share of team targets/carries × team plays from the DK spread and implied total), efficiency and the defense; <b>Fair</b> = those odds with no vig. ⚑ marks tiers where the hit rate and model point opposite ways.
    ${bt ? `<br><b>Backtest ${bt.seasons[0]}–${String(bt.seasons[1]).slice(2)}</b> (${Number(bt.predictions).toLocaleString()} tier calls): the model's probabilities predicted hits better than season hit rates (Brier ${bt.brier_model} vs ${bt.brier_season_hr}, lower is better), and season hit rates beat last-3. Small samples swing hard early in the year.` : ""}</div>`;
  const bind = (id, k) => { $(id).onclick = e => { const b = e.target.closest("button"); if (!b) return; state.pf[k] = b.dataset.v;
    $(id).querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); renderProps(); }; };
  bind("#pMk", "mk"); bind("#pRole", "role"); bind("#pMetric", "metric");
  $("#pLayout").onclick = e => { const b = e.target.closest("button"); if (!b) return; state.pf.layout = b.dataset.v;
    $("#pLayout").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    $("#pMetric").hidden = $("#pMetricHint").hidden = state.pf.layout !== "table"; renderProps(); };
  $("#pGame").onchange = e => { state.pf.game = e.target.value; renderProps(); };
  $("#pQ").oninput = e => { state.pf.q = e.target.value; renderProps(); };
  $("#pDis").onchange = e => { state.pf.dis = e.target.checked; renderProps(); };
  renderProps();
}

const rcls = (h, n) => { if (!n) return "na"; const r = h / n; return r >= .75 ? "r4" : r >= .5 ? "r3" : r >= .34 ? "r2" : r > 0 ? "r1" : "r0"; };
const pcls = p => p >= .7 ? "r4" : p >= .5 ? "r3" : p >= .3 ? "r2" : p >= .12 ? "r1" : "r0";
const fairTxt = o => o == null ? "—" : (o > 0 ? "+" : "") + o;
const ROLE_ORDER = { QB1: 0, RB1: 1, RB2: 2, WR1: 3, WR2: 4, WR3: 5, TE1: 6 };

function propCard(c, mk) {
  const m = c.markets[mk], lab = state.props.labels[mk];
  const tl = t => mk === "atd" ? "TD" : t + "+";
  const cell = ([h, n]) => `<td class="c ${rcls(h, n)}">${n ? `${h}/${n}` : "—"}</td>`;
  const dis = m.disagree || [];
  const u = c.usage, md = c.model;
  const vol = c.pos === "QB" ? `Proj. att <b>${fmt(md.attempts)}</b>` : `${u.tgt_share != null && c.pos !== "RB" ? `Tgt share <b>${pct(u.tgt_share)}</b> · ` : ""}${c.pos === "RB" ? `Carry share <b>${pct(u.car_share)}</b> · ` : ""}Proj. ${c.pos === "RB" ? `carries <b>${fmt(md.carries)}</b> · ` : ""}targets <b>${fmt(md.targets)}</b>`;
  const l3 = m.l3_vals.length ? m.l3_vals.map((v, i) => `${v}${m.l3_opps[i] ? `<span style="color:var(--muted)"> v ${esc(m.l3_opps[i])}</span>` : ""}`).join(", ") : "—";
  const initials = c.name.split(" ").map(x => x[0]).slice(0, 2).join("");
  const hs = c.headshot ? `<img class="hs" src="${esc(c.headshot)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=&quot;hs&quot;>${esc(initials)}</div>'">` : `<div class="hs">${esc(initials)}</div>`;
  const avgTxt = mk === "atd" ? `TDs <b>${m.season_vals.filter(v => v > 0).length}</b> in ${m.season_vals.length} games` : `Season avg <b>${fmt(m.avg)}</b>`;
  const projTxt = mk === "atd" || mk === "pass_td" ? `Model ${mk === "atd" ? "TD rate" : "TDs"} <b>${fmt(m.proj, 2)}</b>` : `Model median <b>${fmt(m.proj, 0)}</b>`;
  return `<div class="pc ${dis.length ? "dis" : ""}">
    <div class="top">${hs}<div style="min-width:0"><div class="nm">${esc(c.name)}<span class="role">${c.role}</span>${c.status ? `<span class="inj">${esc(c.status)}</span>` : ""}</div>
      <div class="sub">${esc(c.team)} ${c.home ? "vs" : "@"} ${esc(c.opp)} · ${c.kick_et} · ${esc(c.team)} implied ${fmt(c.implied)}</div></div></div>
    <div class="facts"><span>${avgTxt}</span><span>L3 <b>${l3}</b></span><span>${projTxt}</span>
      <span>${esc(c.opp)} allows <b>${m.def_avg == null ? "—" : fmt(m.def_avg)}</b> to ${c.role}s${m.def_n ? ` (${m.def_n} g)` : ""}</span>
      <span>${vol}</span>${u.snap_pct != null ? `<span>Snaps <b>${pct(u.snap_pct)}</b></span>` : ""}</div>
    <div class="tierwrap"><table class="tiers" aria-label="${esc(lab)} tiers">
      <thead><tr><th style="text-align:left;color:var(--muted);font:600 10.5px var(--mono)">${esc(lab).toUpperCase()}</th>${m.tiers.map(t => `<th>${tl(t.t)}</th>`).join("")}</tr></thead>
      <tbody>
        <tr><td class="lab">L3</td>${m.tiers.map(t => cell(t.l3)).join("")}</tr>
        <tr><td class="lab">Season</td>${m.tiers.map(t => cell(t.season)).join("")}</tr>
        <tr><td class="lab">Opp vs role</td>${m.tiers.map(t => cell(t.def)).join("")}</tr>
        <tr class="sep"><td colspan="${m.tiers.length + 1}"></td></tr>
        <tr class="model"><td class="lab">Model</td>${m.tiers.map(t => `<td class="c ${pcls(t.p)}">${Math.round(t.p * 100)}%</td>`).join("")}</tr>
        <tr class="fairr"><td class="lab">Fair</td>${m.tiers.map(t => `<td>${fairTxt(t.fair)}</td>`).join("")}</tr>
        ${propAddRow(c, mk)}
      </tbody></table></div>
    ${dis.length ? `<div class="flags">${dis.map(d => `<div>${esc(lab)}${esc(d)}</div>`).join("")}</div>` : ""}
    ${c.prior.dropped.length && c.prior.weight > 0 && !c.prior.dropped.includes("no prior season") ? `<div class="why">Last season ignored: ${esc(c.prior.dropped.join(", "))}</div>` : ""}
  </div>`;
}

function renderProps() {
  const doc = state.props, f = state.pf, q = f.q.toLowerCase();
  let cards = doc.cards.filter(c => c.markets[f.mk]);
  if (f.role !== "all") cards = cards.filter(c => c.role === f.role);
  if (f.game !== "all") cards = cards.filter(c => c.game_id === f.game);
  if (q) cards = cards.filter(c => (c.name + " " + c.team + " " + c.opp).toLowerCase().includes(q));
  if (f.dis) cards = cards.filter(c => (c.markets[f.mk].disagree || []).length);
  if (!cards.length) { $("#pList").innerHTML = `<div class="empty">No players match. Passing markets are QBs only; receptions are for receivers and backs.</div>`; return; }
  if (f.layout === "table") return renderPropTable(cards);
  const byGame = new Map();
  cards.sort((a, b) => (a.kickoff_utc || "").localeCompare(b.kickoff_utc || "") || a.game_id.localeCompare(b.game_id) || (a.home - b.home) || ROLE_ORDER[a.role] - ROLE_ORDER[b.role]);
  // keep game order by kickoff as listed on the board
  for (const c of cards) { if (!byGame.has(c.game_id)) byGame.set(c.game_id, []); byGame.get(c.game_id).push(c); }
  $("#pList").innerHTML = [...byGame.values()].map(cs => { const c = cs[0], h = c.home ? c.team : c.opp, a = c.home ? c.opp : c.team;
    return `<div class="gamehd">${esc(a)} @ ${esc(h)} <small>${c.kick_et} ET</small></div><div class="pgrid">${cs.map(x => propCard(x, f.mk)).join("")}</div>`; }).join("");
}


/* sortable table: one row per player for the chosen market, one column per tier */
function tierFlagged(mk, m, t) { const lab = mk === "atd" ? "" : ` ${t}+`; return (m.disagree || []).some(d => d.startsWith(lab + ":")); }
function tierVal(t, metric) { if (metric === "p") return t.p; const [h, n] = t[metric]; return n ? h / n : -1; }
const P_OPT = new Set(["team", "kick", "implied", "l3avg", "def_avg"]);  // hidden on phones so the tiers sit next to the name
function renderPropTable(cards) {
  const f = state.pf, mk = f.mk, tiers = state.props.tiers[mk], lab = state.props.labels[mk];
  const tl = t => mk === "atd" ? "TD" : t + "+";
  const avgOf = (c, k) => { const m = c.markets[mk], v = k === "l3" ? m.l3_vals : null;
    return k === "avg" ? (m.avg ?? -1) : k === "l3avg" ? (v.length ? v.reduce((a, b) => a + b, 0) / v.length : -1) : k === "proj" ? (m.proj ?? -1) : k === "def_avg" ? (m.def_avg ?? -1) : -1; };
  const cols = [
    { k: "name", l: "Player", v: c => c.name, txt: true },
    { k: "role", l: "Role", v: c => ROLE_ORDER[c.role], txt: false },
    { k: "team", l: "Team", v: c => c.team, txt: true },
    { k: "opp", l: "Opp", v: c => c.opp, txt: true },
    { k: "kick", l: "Kick", v: c => c.kickoff_utc || "", txt: true },
    { k: "implied", l: "Tm imp.", v: c => c.implied ?? -1 },
    { k: "avg", l: mk === "atd" ? "TD g" : "Avg", v: c => mk === "atd" ? c.markets[mk].season_vals.filter(x => x > 0).length : avgOf(c, "avg") },
    { k: "l3avg", l: "L3 avg", v: c => avgOf(c, "l3avg"), hide: mk === "atd" },
    { k: "proj", l: mk === "atd" ? "TD rate" : mk === "pass_td" ? "Proj TDs" : "Model med.", v: c => avgOf(c, "proj") },
    { k: "def_avg", l: "Opp allows", v: c => avgOf(c, "def_avg"), hide: mk === "atd" },
    ...tiers.map((t, i) => ({ k: "t" + i, l: tl(t), tier: i, v: c => tierVal(c.markets[mk].tiers[i], f.metric) })),
  ].filter(c => !c.hide);
  if (f.sort && cols.some(c => c.k === f.sort)) {
    const col = cols.find(c => c.k === f.sort);
    cards = [...cards].sort((a, b) => { const x = col.v(a), y = col.v(b);
      return (col.txt ? String(x).localeCompare(String(y)) : x - y) * f.dir || a.name.localeCompare(b.name); });
  } else {
    cards = [...cards].sort((a, b) => (a.kickoff_utc || "").localeCompare(b.kickoff_utc || "") || a.game_id.localeCompare(b.game_id) || (a.home - b.home) || ROLE_ORDER[a.role] - ROLE_ORDER[b.role]);
  }
  const arrow = k => f.sort === k ? (f.dir > 0 ? " ▲" : " ▼") : "";
  const cellFor = (c, i) => { const t = c.markets[mk].tiers[i], fl = tierFlagged(mk, c.markets[mk], t.t) ? `<span class="tflag" title="Hit rate and model disagree">⚑</span>` : "";
    const ab = slip.admin ? addBtn(propItem(c, mk, t.t)) : "";
    if (f.metric === "p") return `<td class="tc"><span class="c ${pcls(t.p)} m">${Math.round(t.p * 100)}%</span>${fl}<small>${fairTxt(t.fair)}</small>${ab}</td>`;
    const [h, n] = t[f.metric];
    return `<td class="tc"><span class="c ${rcls(h, n)}">${n ? `${h}/${n}` : "—"}</span>${fl}<small>${Math.round(t.p * 100)}%</small>${ab}</td>`; };
  const num1 = x => x == null || x < 0 ? "—" : fmt(x);
  $("#pList").innerHTML = `<div class="tablewrap ptw"><table class="ptable" aria-label="${esc(lab)} by tier">
    <thead><tr>${cols.map(c => `<th class="${c.tier != null ? "tc" : c.k === "name" ? "first" : c.txt ? "" : "num"}${P_OPT.has(c.k) ? " opt" : ""}" data-sort="${c.k}" aria-sort="${f.sort === c.k ? (f.dir > 0 ? "ascending" : "descending") : "none"}" tabindex="0">${esc(c.l)}${arrow(c.k)}</th>`).join("")}</tr></thead>
    <tbody>${cards.map(c => { const m = c.markets[mk];
      return `<tr>
        <td class="first"><span class="team">${esc(c.name)}</span>${c.status ? ` <span class="inj">${esc(c.status)}</span>` : ""}</td>
        <td><span class="role" style="margin:0">${c.role}</span></td>
        <td class="mono opt">${esc(c.team)}</td><td class="mono">${c.home ? "" : "@"}${esc(c.opp)}</td>
        <td class="mono opt" style="color:var(--muted)">${esc(c.kick_et)}</td>
        <td class="num mono opt">${num1(c.implied)}</td>
        <td class="num mono">${mk === "atd" ? `${m.season_vals.filter(x => x > 0).length}/${m.season_vals.length}` : num1(m.avg)}</td>
        ${mk === "atd" ? "" : `<td class="num mono opt">${m.l3_vals.length ? fmt(m.l3_vals.reduce((a, b) => a + b, 0) / m.l3_vals.length) : "—"}</td>`}
        <td class="num mono">${mk === "atd" || mk === "pass_td" ? fmt(m.proj, 2) : num1(m.proj)}</td>
        ${mk === "atd" ? "" : `<td class="num mono opt">${num1(m.def_avg)}</td>`}
        ${tiers.map((_, i) => cellFor(c, i)).join("")}</tr>`; }).join("")}</tbody></table></div>
    <div class="edge" style="margin-top:8px">${f.metric === "p" ? "Cells: model probability, fair odds underneath." : `Cells: ${f.metric === "l3" ? "last 3 games" : f.metric === "season" ? "this season" : "this defense vs the same role"} hit rate, model probability underneath.`} ⚑ = hit rate and model point opposite ways. Sorting a tier column sorts by the number shown.</div>`;
  const sortBy = th => { const k = th.dataset.sort; if (f.sort === k) f.dir = -f.dir; else { f.sort = k; f.dir = ["name", "team", "opp", "kick", "role"].includes(k) ? 1 : -1; } renderProps(); };
  $("#pList").querySelectorAll("th[data-sort]").forEach(th => { th.onclick = () => sortBy(th); th.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); sortBy(th); } }; });
}

/* ------------------------------------------------------------------ bet slip (admin only)
   When you're logged in to the Ballwatcher admin, every graded line, both sides in the game drawer and every
   prop tier get a "+" button. Picks collect in a slip tray (saved in this browser). From the tray you open a
   prefilled straight slip, or a prefilled parlay from several picks, in the admin. Nothing is saved on the
   site until you review it there and press Publish.
   Handoff: /admin/slips/prefill?d=<base64url JSON>  { v:1, kind:"straight"|"parlay", sport, market, pick, odds,
   game, starts_at, odds_at, reasoning, legs:[{sport, pick, game, odds, market, starts_at}] } */
const SLIP_KEY = "bw_slip_v1", ADMIN_PREFILL = "/admin/slips/prefill", ADMIN_WHOAMI = "/admin/whoami";
const SLIPSRC = {};   // id -> item, for the "+" buttons on screen
let slipSeq = 0;
const slip = { admin: false, items: [], open: false };
try { slip.items = JSON.parse(localStorage.getItem(SLIP_KEY) || "[]"); } catch (e) { slip.items = []; }
function saveSlip() { try { localStorage.setItem(SLIP_KEY, JSON.stringify(slip.items)); } catch (e) {} }

async function detectAdmin() {
  if (/(^|&)admin=preview(&|$)/.test(location.hash.slice(1))) { slip.admin = true; return; }  // layout preview only
  try {
    const r = await fetch(ADMIN_WHOAMI, { credentials: "same-origin", cache: "no-store" });
    if (r.ok) { const j = await r.json(); slip.admin = !!(j && j.admin); }
  } catch (e) { slip.admin = false; }
}

function regItem(it) { const id = "s" + (++slipSeq); SLIPSRC[id] = it; return id; }
const inSlip = it => slip.items.some(x => x.key === it.key);
function addBtn(it, label) {
  if (!slip.admin || !it) return "";
  const id = regItem(it), on = inSlip(it);
  return `<button class="addb${on ? " on" : ""}" data-slip="${id}" title="${on ? "In your slip" : "Add to bet slip"}" aria-label="${on ? "In your slip" : "Add to bet slip"}: ${esc(it.pick)}">${on ? "✓" : "+"}${label ? " " + esc(label) : ""}</button>`;
}
const gameName = g => `${g.away_name || g.away} ${g.neutral ? "vs" : "@"} ${g.home_name || g.home}`;
const sportOf = () => state.sport;

/* line items (spreads / totals) */
function lineItem(g, k, sideKey) {
  const d = g.dk, sp = sportOf(), m = g.model;
  if (k === "side") {
    const home = sideKey === "home", ln = home ? d.home_spread : -d.home_spread;
    if (ln == null || isNaN(ln)) return null;
    const team = home ? g.home_abbr : g.away_abbr;
    // written for the public slip / Today's Card: plain numbers, no internal grade labels
    const why = sp === "nfl"
      ? `Our number: ${g.home_abbr} ${sgn(m.number)} vs DraftKings ${sgn(d.home_spread)}. This season's EPA, success-rate and points ratings make it ${g.home_abbr} ${sgn(m.epa_spread)}, ${sgn(m.sr_spread)} and ${sgn(m.pts_spread)}.`
      : `SP+ makes it ${g.home_abbr} ${sgn(m.sp_spread_cal)} and Elo ${sgn(m.elo_spread_cal)}, vs DraftKings ${sgn(d.home_spread)}.`;
    return { key: `${sp}:${g.id}:side:${sideKey}`, gid: `${sp}:${g.id}`, sport: sp, market: "Spread", pick: `${team} ${ln > 0 ? "+" : ""}${fmt(ln)}`,
      odds: home ? d.home_spread_odds : d.away_spread_odds, game: gameName(g), starts_at: g.kickoff_utc, odds_at: state.slate.odds_pulled_utc, reasoning: why };
  }
  if (d.total == null) return null;
  const over = sideKey === "over";
  const why = sp === "nfl" ? `Our total: ${fmt(m.total_number)} vs DraftKings ${fmt(d.total)} (EPA-and-pace model ${fmt(m.epa_total)}, points model ${fmt(m.pts_total)}).`
    : `SP+ projects ${fmt(m.sp_total_cal)} and the per-play model ${fmt(m.pp_total_cal)}, vs DraftKings ${fmt(d.total)}.`;
  return { key: `${sp}:${g.id}:total:${sideKey}`, gid: `${sp}:${g.id}`, sport: sp, market: "Total", pick: `${over ? "Over" : "Under"} ${fmt(d.total)}`,
    odds: over ? d.over_odds : d.under_odds, game: gameName(g), starts_at: g.kickoff_utc, odds_at: state.slate.odds_pulled_utc, reasoning: why };
}
// "+" next to a graded pick in the table / mobile list
function pickAdd(m, g, k) { return m && m.pick && m.pick_side && g ? addBtn(lineItem(g, k, m.pick_side)) : ""; }
// both sides of both markets, in the game drawer
function drawerAdds(g, k) {
  if (!slip.admin) return "";
  const keys = k === "side" ? ["away", "home"] : ["over", "under"];
  return `<div class="addrow">${keys.map(x => { const it = lineItem(g, k, x); return it ? addBtn(it, it.pick + (it.odds ? ` (${it.odds})` : "")) : ""; }).join("")}</div>`;
}

/* prop items */
function propItem(c, mk, t) {
  const m = c.markets[mk], lab = state.props.labels[mk];
  const tier = m.tiers.find(x => x.t === t); if (!tier) return null;
  const pick = mk === "atd" ? `${c.name} anytime TD` : `${c.name} ${t}+ ${lab.toLowerCase()}`;
  const hr = ([h, n]) => n ? `${h}/${n}` : "—";
  return { key: `nfl:prop:${c.id}:${mk}:${t}`, gid: `nfl:${c.game_id}`, sport: "nfl", market: `Player prop: ${lab}`, pick, odds: null,
    game: `${c.home ? c.opp : c.team} @ ${c.home ? c.team : c.opp}`, starts_at: c.kickoff_utc, odds_at: null,
    reasoning: `Hit ${hr(tier.season)} this season and ${hr(tier.l3)} in the last 3; ${c.opp} has allowed it to ${c.role}s ${hr(tier.def)}. Our model: ${Math.round(tier.p * 100)}%.` };
}
function propAddRow(c, mk) {
  if (!slip.admin) return "";
  const m = c.markets[mk];
  return `<tr class="addtr"><td class="lab">Slip</td>${m.tiers.map(t => `<td>${addBtn(propItem(c, mk, t.t))}</td>`).join("")}</tr>`;
}

/* tray */
function toggleItem(it) {
  if (!it) return;
  const i = slip.items.findIndex(x => x.key === it.key);
  if (i >= 0) slip.items.splice(i, 1); else slip.items.push(it);
  saveSlip(); drawTray();
  document.querySelectorAll(".addb").forEach(b => { const x = SLIPSRC[b.dataset.slip]; if (!x) return; const on = inSlip(x);
    b.classList.toggle("on", on); b.innerHTML = b.innerHTML.replace(/^(\+|✓)/, on ? "✓" : "+"); b.title = on ? "In your slip" : "Add to bet slip"; });
}
const b64u = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
function amToDec(o) { const n = parseFloat(o); if (isNaN(n) || n === 0) return null; return n > 0 ? 1 + n / 100 : 1 + 100 / -n; }
function decToAm(d) { if (!d || d <= 1) return null; return d >= 2 ? "+" + Math.round((d - 1) * 100) : String(Math.round(-100 / (d - 1))); }
function openPrefill(payload) { window.open(`${ADMIN_PREFILL}?d=${b64u(JSON.stringify({ v: 1, ...payload }))}`, "_blank"); }
function openStraight(it) {
  openPrefill({ kind: "straight", sport: it.sport, market: it.market, pick: it.pick, odds: it.odds || "", game: it.game,
    starts_at: it.starts_at, odds_at: it.odds_at, reasoning: it.reasoning });
}
function openParlay() {
  const legs = slip.items;
  const sports = [...new Set(legs.map(x => x.sport))];
  const sameGame = new Set(legs.map(x => x.gid || x.game)).size === 1;
  const dec = legs.every(x => amToDec(x.odds)) ? legs.reduce((a, x) => a * amToDec(x.odds), 1) : null;
  openPrefill({ kind: sameGame ? "sgp" : "parlay", sport: sports.length === 1 ? sports[0] : "", market: sameGame ? "Same game parlay" : "Parlay",
    title: `${legs.length}-leg ${sameGame ? "SGP" : "parlay"}`, starts_at: legs.map(x => x.starts_at).filter(Boolean).sort()[0],
    est_odds: decToAm(dec), legs: legs.map(x => ({ sport: x.sport, pick: x.pick, game: x.game, odds: x.odds || "", market: x.market, starts_at: x.starts_at })),
    reasoning: legs.map(x => `${x.pick}: ${x.reasoning}`).join(" ").slice(0, 1000) });
}
function drawTray() {
  let t = $("#slipTray");
  if (!slip.admin) { if (t) t.remove(); return; }
  if (!t) { t = document.createElement("div"); t.id = "slipTray"; document.body.appendChild(t);
    t.addEventListener("click", trayClick); t.addEventListener("input", trayInput); }
  const n = slip.items.length;
  t.className = "tray" + (slip.open ? " open" : "") + (n ? "" : " empty");
  const dec = n > 1 && slip.items.every(x => amToDec(x.odds)) ? slip.items.reduce((a, x) => a * amToDec(x.odds), 1) : null;
  const sameGame = n > 1 && new Set(slip.items.map(x => x.gid || x.game)).size === 1;
  t.innerHTML = `<button class="trayhd" data-act="toggle" aria-expanded="${slip.open}">Bet slip <b>${n}</b>${n > 1 ? `<span>${sameGame ? "SGP" : "parlay"} ready</span>` : ""}<i>${slip.open ? "▾" : "▴"}</i></button>
    ${slip.open ? `<div class="traybd">
      ${n ? slip.items.map((x, i) => `<div class="titem">
        <div class="tmain"><div class="tpick">${esc(x.pick)}</div><div class="tsub">${esc(x.sport.toUpperCase())} · ${esc(x.market)} · ${esc(x.game)}</div></div>
        <input class="todds" data-i="${i}" value="${esc(x.odds || "")}" placeholder="DK odds" aria-label="DraftKings odds for ${esc(x.pick)}" inputmode="numeric">
        <button class="tbtn" data-act="one" data-i="${i}" title="Open as a straight bet in the admin">Straight ↗</button>
        <button class="tx" data-act="rm" data-i="${i}" aria-label="Remove ${esc(x.pick)}">✕</button></div>`).join("")
        : `<div class="empty">Tap + on any line or prop tier to add it here.</div>`}
      ${n ? `<div class="tfoot">
        ${n > 1 ? `<button class="tbtn main" data-act="parlay">Build ${sameGame ? "SGP" : "parlay"} (${n} legs) ↗</button>
          <span class="edge">${dec ? `Est. from leg odds ${decToAm(dec)} — enter DraftKings' actual parlay price in the admin` : "Enter DraftKings' parlay price in the admin"}</span>` : ""}
        <button class="tbtn ghost" data-act="clear">Clear</button></div>
      <div class="edge" style="margin-top:6px">Opens the admin slip form prefilled. Set units and confidence, confirm the DK price, then Publish. Props need the DK price typed in.</div>` : ""}
    </div>` : ""}`;
}
function trayClick(e) {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, i = +b.dataset.i;
  if (a === "toggle") { slip.open = !slip.open; drawTray(); }
  else if (a === "rm") { slip.items.splice(i, 1); saveSlip(); drawTray(); refreshAdds(); }
  else if (a === "clear") { slip.items = []; saveSlip(); drawTray(); refreshAdds(); }
  else if (a === "one") openStraight(slip.items[i]);
  else if (a === "parlay") openParlay();
}
function trayInput(e) { const inp = e.target.closest(".todds"); if (!inp) return; slip.items[+inp.dataset.i].odds = inp.value.trim(); saveSlip(); }
function refreshAdds() { document.querySelectorAll(".addb").forEach(b => { const x = SLIPSRC[b.dataset.slip]; if (!x) return; const on = inSlip(x);
  b.classList.toggle("on", on); b.innerHTML = b.innerHTML.replace(/^(\+|✓)/, on ? "✓" : "+"); }); }
document.addEventListener("click", e => { const b = e.target.closest(".addb"); if (!b) return; e.preventDefault(); e.stopPropagation(); toggleItem(SLIPSRC[b.dataset.slip]); }, true);

/* ------------------------------------------------------------------ start */
(function start() {
  const hp = hashParams();
  let sp = hp.get("s"), key = hp.get("k") || hp.get("d"), view = hp.get("v");
  if (!SPORTS[sp] || SPORTS[sp].soon) sp = hp.get("d") ? "cfb" : (location.hash.match(/nfl/i) ? "nfl" : null);
  if (!sp) { // in season, show the sport with games soonest; default NFL on Sun/Mon/Thu, CFB on Fri/Sat
    const day = new Date(Date.now() - 4 * 3600e3).getUTCDay(); sp = [5, 6].includes(day) ? "cfb" : "nfl";
  }
  detectAdmin().then(() => { drawTray(); setSport(sp, key, view); });
})();
// links that change only the hash (e.g. #s=nfl) switch sport/slate without a reload
window.addEventListener("hashchange", () => {
  const hp = hashParams(), sp = hp.get("s"), key = hp.get("k");
  const v = hp.get("v") === "props" ? "props" : "lines";
  if (SPORTS[sp] && !SPORTS[sp].soon && sp !== state.sport) setSport(sp, key, v);
  else if (sp === state.sport && (v !== state.view || (key && key !== state.key))) { state.view = v; drawViews(); load(key || state.key); }
});
</script>
</body>

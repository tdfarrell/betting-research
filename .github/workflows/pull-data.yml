name: Pull betting data

on:
  schedule:
    # DraftKings lines via ESPN: every 30 min (UTC)
    - cron: "*/30 * * * *"
    # CollegeFootballData + nflverse stats: twice a day (~6am / 6pm ET)
    - cron: "7 10,22 * * *"
    # Sunday 11:17am ET: fresh injuries, rosters and implied totals for the NFL prop cards before kickoff
    - cron: "17 15 * * 0"
  workflow_dispatch:
    inputs:
      cfbd:
        description: "Also pull CFBD stats now"
        type: boolean
        default: true
      nflverse:
        description: "Also pull nflverse stats now"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: pull-data
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages
        run: pip install --quiet numpy pandas

      - name: DraftKings lines (ESPN)
        run: python scripts/espn_odds.py

      - name: DraftKings player prop lines (ESPN)
        continue-on-error: true
        run: python scripts/espn_props.py

      - name: NBA box scores + injuries (ESPN), DK NBA prop lines
        continue-on-error: true
        run: |
          python scripts/nba_pull.py
          python scripts/espn_props_nba.py

      - name: Final scores + box scores (ESPN) for auto-grading
        continue-on-error: true
        run: python scripts/results_pull.py

      - name: CFBD stats
        if: github.event.schedule == '7 10,22 * * *' || (github.event_name == 'workflow_dispatch' && inputs.cfbd)
        env:
          CFBD_KEY: ${{ secrets.CFBD_KEY }}
        run: python scripts/cfbd_pull.py

      - name: nflverse stats
        continue-on-error: true
        if: github.event.schedule == '7 10,22 * * *' || github.event.schedule == '17 15 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.nflverse)
        run: python scripts/nflverse_pull.py

      - name: Grade slates (SP+ / Elo / per-play)
        run: |
          if [ -f data/cfbd/sp_ratings.json ]; then python scripts/regrade.py; fi

      - name: Grade NFL weeks (EPA / Elo / points, QB adjusted) + CLV log
        continue-on-error: true
        run: |
          if [ -f data/nfl/team_games.csv ]; then python scripts/regrade_nfl.py; fi

      - name: NFL prop cards (hit rates + model)
        continue-on-error: true
        if: github.event.schedule == '7 10,22 * * *' || github.event.schedule == '17 15 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.nflverse)
        run: python scripts/nfl_props.py

      - name: College basketball scores + board
        continue-on-error: true
        run: |
          python scripts/cbb_pull.py
          if [ -f data/cbb/games.csv ]; then python scripts/regrade_cbb.py; fi

      - name: Grade NBA slates + prop cards
        continue-on-error: true
        run: |
          if [ -f data/nba/team_games.csv ]; then python scripts/regrade_nba.py && python scripts/nba_props.py; fi

      - name: Screener grades its own picks (kickoff snapshots, results, day-by-day record)
        continue-on-error: true
        run: python scripts/grade_screener.py

      - name: Commit changes
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

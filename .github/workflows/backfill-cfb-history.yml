name: Backfill CFB history (CFBD)

# One-time (re-runnable): past CFB games with pregame Elo and DraftKings/consensus lines,
# for the CFB calibration backtest. About 2 CFBD calls per season.
on:
  workflow_dispatch:
    inputs:
      first:
        description: "First season"
        default: "2022"
      last:
        description: "Last season"
        default: "2025"

permissions:
  contents: write

concurrency:
  group: pull-data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull CFBD history
        env:
          CFBD_KEY: ${{ secrets.CFBD_KEY }}
        run: python scripts/cfbd_backfill.py ${{ inputs.first }} ${{ inputs.last }}
      - name: Commit
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/cfbd/history_games.csv
          git diff --cached --quiet || git commit -m "data: CFB history backfill"
          git pull --rebase --autostash
          git push

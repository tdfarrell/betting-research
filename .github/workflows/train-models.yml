name: Retrain prediction models (v3)

# Weekly: rebuild the walk-forward tables and refit the final game-line and NBA prop models
# (data/models/*). The 30-minute data job only applies them.
on:
  schedule:
    - cron: "17 9 * * 1"     # Mondays ~5am ET
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pull-data
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: pip install --quiet numpy pandas scipy scikit-learn lightgbm
      - name: Game-line walk-forward tables
        continue-on-error: true
        run: |
          python scripts/nba_games_v3.py
          rm -f data/cbb/v3_rows.csv && python scripts/cbb_games_v3.py
          python scripts/nfl_games_v3.py
          python scripts/cfb_games_v3.py
      - name: Fit final game-line models
        run: python scripts/games_live.py train
      - name: Fit final NBA prop models
        run: python scripts/nba_props_live.py train
      - name: Commit
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/models data/nba/v3_games.csv data/nba/v3_preds.csv data/cbb/v3_games.csv data/cbb/v3_preds.csv data/cbb/v3_rows.csv data/cfbd/v3_games.csv data/cfbd/v3_preds.csv data/nfl/v3_preds.csv
          git diff --cached --quiet || git commit -m "models: weekly retrain"
          git pull --rebase -X theirs || (git rebase --abort; git pull --no-rebase -X ours)
          git push

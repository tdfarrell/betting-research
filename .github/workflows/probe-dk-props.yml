name: Probe DK prop lines

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pull-data
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probes (DK prop lines, NBA sources)
        run: python scripts/probe_dk_props.py && python scripts/probe_nba.py
      - name: Commit result
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/probe
          git diff --cached --quiet || git commit -m "probe: DK prop lines"
          git pull --rebase
          git push
